<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"SF Pro",Inter,sans-serif;background:#fff;color:#111;max-width:440px;margin:0 auto;padding:0 0 120px;-webkit-font-smoothing:antialiased}
.top{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0ef;position:sticky;top:0;background:#fff;z-index:20}
.logo{font-size:34px;font-weight:900;letter-spacing:-0.06em;line-height:1}
.actions-top{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn-mini{font-size:11px;border:1px solid #ecece8;border-radius:999px;padding:7px 11px;background:#fff;cursor:pointer;font-weight:600}
.btn-mini.wa{background:#25D366;color:#fff;border-color:#25D366}
.btn-mini.dark{background:#111;color:#fff;border-color:#111}
.saldo-wrap{padding:18px 20px 16px;border-bottom:1px solid #f6f6f4}
.row-saldo{display:flex;gap:10px}
.item-s{flex:1;background:#fafaf8;border:1px solid #f0f0ef;border-radius:14px;padding:12px}
.item-s small{display:block;font-size:9px;letter-spacing:0.12em;color:#9a9a96;font-weight:700;margin-bottom:3px}
.item-s b{font-size:15px;font-weight:800;display:block}
.sync-box{background:#f0fdf4;border:1px dashed #22c55e;border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.sync-box b{font-size:11px}
.bar-wrap{height:5px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:6px}
.bar{height:100%;background:#22c55e;width:0%;transition:width 0.3s}
.section{padding:0 20px;margin-top:24px}
.h{font-size:10px;letter-spacing:0.14em;color:#9a9a96;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.list{border-top:1px solid #f0f0ef}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f6f6f4;gap:10px}
.left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:#9a9a96;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:ui-monospace,monospace;font-size:13px;font-weight:700}
.right{font-size:13px;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
.logo-box{width:32px;height:32px;border-radius:10px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.logo-box.cash{background:#fff;color:#111;border:1px solid #ecece8}.logo-box.rek{background:#fff;border:1px solid #ecece8;color:#111;font-size:8px;font-weight:900}
.logo-box svg{width:16px;height:16px}
.btn-copy{font-size:10px;border:1px solid #ecece8;border-radius:999px;padding:5px 10px;background:#fff;cursor:pointer;font-weight:700;color:#777}
.btn-del{width:24px;height:24px;border-radius:50%;border:1px solid #ecece8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;padding:10px 16px;border-radius:999px;display:none;z-index:99;max-width:92%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:#fff;border:1px solid #ecece8;border-radius:20px;padding:20px;width:100%;max-width:360px}
.input{width:100%;border:none;border-bottom:1px solid #ecece8;padding:12px 0;font-size:14px;outline:none;text-align:center}
.btn{width:100%;border:1px solid #111;background:#111;color:#fff;border-radius:999px;padding:12px;font-size:12px;font-weight:600;cursor:pointer}.btn-ghost{width:100%;border:1px solid #ecece8;background:#fff;border-radius:999px;padding:12px;font-size:12px;cursor:pointer}
</style>

<body>

<div id="login" class="modal"><div class="box"><div style="font-weight:700;font-size:13px;text-align:center">Login Admin</div><input id="pass" type="password" placeholder="Password" class="input" style="margin-top:14px"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-ghost" style="flex:1" onclick="toggleLogin()">Batal</button><button class="btn" style="flex:1" onclick="doLogin()">Masuk</button></div></div></div>
<div id="confirmDel" class="modal"><div class="box"><div style="font-weight:700;font-size:13px">Hapus transaksi?</div><div id="delInfo" style="font-size:12px;color:#9a9a96;margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-ghost" style="flex:1" onclick="closeDel()">Batal</button><button class="btn" style="flex:1;background:#e11d48;border-color:#e11d48" onclick="doDelete()">Hapus</button></div></div></div>
<div id="copyM" class="modal"><div class="box" style="text-align:center"><div style="font-size:10px;letter-spacing:0.12em;color:#9a9a96;font-weight:700">NO REKENING</div><div id="copyL" style="font-weight:700;margin-top:4px"></div><div style="background:#fafaf8;border-radius:12px;padding:14px;margin:12px 0"><input id="copyI" readonly style="width:100%;border:none;background:transparent;text-align:center;font-family:ui-monospace;font-size:20px;font-weight:800;outline:none"></div><div style="display:flex;gap:8px"><button class="btn-ghost" style="flex:1" onclick="closeCopy()">Tutup</button><button class="btn" style="flex:1" onclick="copyAgain()">Copy</button></div></div></div>
<div id="pdfM" class="modal"><div class="box" style="text-align:center"><div style="font-weight:700">PDF Siap</div><div id="pdfI" style="font-size:11px;color:#9a9a96;margin-top:4px"></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><button class="btn" onclick="doPrint()">Print / Save PDF</button><button class="btn-ghost" style="border:none" onclick="closePdf()">Tutup</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
var URL_G="https://script.google.com/macros/s/AKfycbwZyzfPgJiNbBsxwKAfFxnRq2Iz50g9XYvkXU9CJdfywd9bc9n5bGpv7sXyKSOE3Ux72A/exec";
var DEF_B=[{name:"BCA",number:"6830747280",owner:"Eka Iswanto"},{name:"MANDIRI",number:"1570005764080",owner:"Eka Iswanto"}];
var DEF_M=["Nia","Aditya","Anisa","Aaf","Syarif","Budi","Topik","Yudi","Heru","Dozen","Putri","Arief","Anah","Supriyadi","Zaelani","Nely","Eka"];
var PRELOAD=[
{id:"t-nia-17",date:"2026-08-27",memberName:"Nia",amount:100000,bank:"MANDIRI",desc:"Iuran Nia",pay:"transfer"},
{id:"t-aditya-17",date:"2026-08-27",memberName:"Aditya",amount:100000,bank:"MANDIRI",desc:"Iuran Aditya",pay:"transfer"},
{id:"t-anisa-17",date:"2026-08-27",memberName:"Anisa",amount:100000,bank:"BCA",desc:"Iuran Anisa",pay:"transfer"},
{id:"t-aaf-17",date:"2026-08-27",memberName:"Aaf",amount:100000,bank:"BCA",desc:"Iuran Aaf",pay:"transfer"},
{id:"t-syarif-17",date:"2026-08-27",memberName:"Syarif",amount:100000,bank:"BCA",desc:"Iuran Syarif",pay:"transfer"},
{id:"t-budi-17",date:"2026-08-27",memberName:"Budi",amount:100000,bank:"BCA",desc:"Iuran Budi",pay:"transfer"},
{id:"t-topik-17",date:"2026-08-27",memberName:"Topik",amount:100000,bank:"BCA",desc:"Iuran Topik (Opik)",pay:"transfer"},
{id:"t-yudi-17",date:"2026-08-27",memberName:"Yudi",amount:100000,bank:"BCA",desc:"Iuran Yudi",pay:"transfer"},
{id:"t-heru-17",date:"2026-08-27",memberName:"Heru",amount:100000,bank:"CASH",desc:"Iuran Heru (Pak Heru)",pay:"cash"},
{id:"t-dozen-17",date:"2026-08-27",memberName:"Dozen",amount:100000,bank:"BCA",desc:"Iuran Dozen",pay:"transfer"},
{id:"t-putri-17",date:"2026-08-27",memberName:"Putri",amount:100000,bank:"CASH",desc:"Iuran Putri",pay:"cash"},
{id:"t-arief-17",date:"2026-08-27",memberName:"Arief",amount:100000,bank:"CASH",desc:"Iuran Arief",pay:"cash"},
{id:"t-anah-17",date:"2026-08-27",memberName:"Anah",amount:100000,bank:"CASH",desc:"Iuran Anah",pay:"cash"},
{id:"t-supriyadi-17",date:"2026-08-27",memberName:"Supriyadi",amount:100000,bank:"BCA",desc:"Iuran Supriyadi",pay:"transfer"},
{id:"t-zaelani-17",date:"2026-08-27",memberName:"Zaelani",amount:100000,bank:"CASH",desc:"Iuran Zaelani",pay:"cash"},
{id:"t-nely-17",date:"2026-08-27",memberName:"Nely",amount:100000,bank:"CASH",desc:"Iuran Nely (Neli)",pay:"cash"},
{id:"t-eka-17",date:"2026-08-27",memberName:"Eka",amount:100000,bank:"BCA",desc:"Iuran Eka",pay:"transfer"}
];
var txs=PRELOAD.slice(),isAdmin=false,KEY="kas-v84-v2-deskripsi",lastBlob=null,delId=null,lastNum='';
function fmt(n){return new Intl.NumberFormat("id-ID").format(n||0)}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function toggleLogin(){var m=document.getElementById('login');if(isAdmin){isAdmin=false;localStorage.setItem(KEY+'-admin','0');upd();m.style.display='none';return}m.style.display=m.style.display==='flex'?'none':'flex'}
function doLogin(){var p=document.getElementById('pass').value.trim().toLowerCase();if(p==='askief'){isAdmin=true;localStorage.setItem(KEY+'-admin','1');document.getElementById('login').style.display='none';document.getElementById('pass').value='';upd();toast('Admin aktif')}}
function svgBank(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10L12 4l9 6v1H3v-1z"/><path d="M2 19h20"/></svg>'}
function svgCash(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>'}
function copyRek(num,label){lastNum=String(num).trim();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastNum).then(()=>{toast('Disalin '+label);showCopy(lastNum,label)}).catch(()=>showCopy(lastNum,label))}else showCopy(lastNum,label)}
function showCopy(num,label){document.getElementById('copyL').textContent=label;document.getElementById('copyI').value=num;document.getElementById('copyM').style.display='flex';setTimeout(()=>{document.getElementById('copyI').select()},80)}
function closeCopy(){document.getElementById('copyM').style.display='none'}
function copyAgain(){var i=document.getElementById('copyI');i.select();try{document.execCommand('copy');toast('Disalin');setTimeout(closeCopy,400)}catch(e){}}
function askDelete(id){if(!isAdmin){toggleLogin();return}delId=id;var t=txs.find(x=>x.id===id);if(t) document.getElementById('delInfo').textContent=t.memberName+' • Rp '+fmt(t.amount);document.getElementById('confirmDel').style.display='flex'}
function closeDel(){document.getElementById('confirmDel').style.display='none';delId=null}
function doDelete(){if(!delId)return;txs=txs.filter(x=>x.id!==delId);localStorage.setItem(KEY+'-txs',JSON.stringify(txs));upd();closeDel();toast('Dihapus');try{fetch(URL_G,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"deleteTransaksi",ID:delId})})}catch(e){}}
function exportPDF(){var html='<html><head><meta charset="UTF-8"><style>body{font-family:system-ui;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px;font-size:11px}th{background:#111;color:#fff}.r{text-align:right}</style></head><body><h2>KAS EF - Rp '+fmt(txs.reduce((s,t)=>s+t.amount,0))+'</h2><p>Total Saldo: Rp '+fmt(txs.reduce((s,t)=>s+t.amount,0))+' | Masuk: Rp '+fmt(txs.reduce((s,t)=>s+t.amount,0))+' | Keluar: Rp 0</p><table><tr><th>No</th><th>Tgl</th><th>Nama</th><th>Bank</th><th>Desc</th><th>Nominal</th></tr>';txs.forEach((t,i)=>{html+=`<tr><td>${i+1}</td><td>${t.date}</td><td>${t.memberName}</td><td>${t.bank}</td><td>${t.desc}</td><td class="r">Rp ${fmt(t.amount)}</td></tr>`});html+='</table></body></html>';var blob=new Blob([html],{type:'text/html'});if(lastBlob)URL.revokeObjectURL(lastBlob);lastBlob=URL.createObjectURL(blob);document.getElementById('pdfI').textContent=txs.length+' trx';document.getElementById('pdfM').style.display='flex'}
function closePdf(){document.getElementById('pdfM').style.display='none'}
function doPrint(){if(!lastBlob)return;var w=window.open(lastBlob,'_blank');setTimeout(()=>w.print(),400)}
function syncNow(){document.getElementById('syncText').textContent='Mengecek DB...';fetch(URL_G+"?action=getData&t="+Date.now()).then(r=>r.json()).then(d=>{var len=d.transaksi?d.transaksi.length:0;document.getElementById('syncText').textContent=`DB ada ${len} trx`;document.getElementById('syncSub').textContent=len>=17?'✅ Lengkap di Sheet':'⚠️ Belum lengkap';document.getElementById('syncIcon').textContent=len>=17?'✅':'⚠️';toast(`DB: ${len} trx`)}).catch(()=>{document.getElementById('syncText').textContent='Offline - cek internet';toast('Gagal cek DB')})}
function forceSync(){
document.getElementById('syncText').textContent='Mengirim 17 ke DB...';
document.getElementById('syncSub').textContent='Jangan tutup halaman';
document.getElementById('syncIcon').textContent='🚀';
var count=0;document.getElementById('bar').style.width='0%';
PRELOAD.forEach((it,idx)=>{
setTimeout(()=>{
fetch(URL_G,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"addTransaksi",ID:it.id,Tanggal:it.date,Anggota:it.memberName,Kategori:it.bank+" | "+it.desc+" | "+it.pay,Nominal:it.amount})}).then(()=>{
count++;var pct=Math.round(count/PRELOAD.length*100);document.getElementById('bar').style.width=pct+'%';document.getElementById('syncText').textContent=`Mengirim ${count}/17...`;
if(count===PRELOAD.length){document.getElementById('syncText').textContent='✅ 17 terkirim ke DB';document.getElementById('syncSub').textContent='Cek Google Sheet sekarang';document.getElementById('syncIcon').textContent='✅';toast('✅ 17 sinkron ke DB');localStorage.setItem('kas-pushed-17','1');}
}).catch(()=>{count++;document.getElementById('syncText').textContent=`Error ${count}/17`;});
}, idx*500);
});
}
function shareWA(){
var masuk=txs.reduce((s,t)=>s+t.amount,0);
var txt=`*KAS EF*%0A%0ATotal Saldo: Rp ${fmt(masuk)}%0AMasuk: Rp ${fmt(masuk)}%0AKeluar: Rp 0%0A%0ATotal Iuran per Anggota:%0A`;
DEF_M.forEach(n=>{var tot=txs.filter(t=>t.memberName===n).reduce((s,t)=>s+t.amount,0);txt+=`${n}: Rp ${fmt(tot)}%0A`;});
txt+=`%0ATotal: Rp ${fmt(masuk)} (17 lunas)`;
window.open("https://wa.me/?text="+txt,'_blank');
}
function upd(){
var masuk=txs.reduce((s,t)=>s+t.amount,0);
document.getElementById('totalSaldo').textContent='Rp '+fmt(masuk);
document.getElementById('masuk').textContent='Rp '+fmt(masuk);
document.getElementById('keluar').textContent='Rp 0';
document.getElementById('ac').textContent=DEF_M.length;
document.getElementById('rc').textContent=DEF_B.length;
document.getElementById('tc').textContent=txs.length+'/'+txs.length;
document.getElementById('loginBtn').textContent=isAdmin?'Keluar':'Login';
document.getElementById('rlist').innerHTML=DEF_B.map(b=>`<div class="row"><div class="left"><div class="logo-box rek">${b.name.slice(0,3)}</div><div><div style="font-size:11px;color:#9a9a96">${b.name} • ${b.owner}</div><div class="mono" onclick="copyRek('${b.number}','${b.name}')">${b.number}</div></div></div><div class="right"><button class="btn-copy" onclick="copyRek('${b.number}','${b.name}')">COPY</button></div></div>`).join('');
document.getElementById('alist').innerHTML=DEF_M.map(n=>{
var tot=txs.filter(t=>t.memberName===n).reduce((s,t)=>s+t.amount,0);
return `<div class="row"><div class="left"><div class="name">${n}</div></div><div class="right">Rp ${fmt(tot)}</div></div>`;
}).join('');
document.getElementById('txlist').innerHTML=txs.map(t=>{
var isTr=t.pay==='transfer';
return `<div class="row"><div class="left"><div class="logo-box ${isTr?'':'cash'}">${isTr?svgBank():svgCash()}</div><div style="min-width:0"><div class="name">${t.memberName} • ${t.bank}</div><div class="sub">${t.date} • ${t.desc}</div></div></div><div class="right">Rp ${fmt(t.amount)} ${isAdmin?`<button class="btn-del" onclick="askDelete('${t.id}')">×</button>`:''}</div></div>`;
}).join('');
}
upd();
setTimeout(()=>{if(!localStorage.getItem('kas-pushed-17')){forceSync()}else{document.getElementById('syncText').textContent='Sudah sinkron 17 ke DB';document.getElementById('syncSub').textContent='Klik Sync DB untuk cek / kirim ulang';document.getElementById('bar').style.width='100%';document.getElementById('syncIcon').textContent='✅';}},1500);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.style.display='none'}))
