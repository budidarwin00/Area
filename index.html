<script>
var URL_G="https://script.google.com/macros/s/AKfycbwZyzfPgJiNbBsxwKAfFxnRq2Iz50g9XYvkXU9CJdfywd9bc9n5bGpv7sXyKSOE3Ux72A/exec";
var txs=[], isAdmin=true, KEY_BANK="kas-ef-banks-v1", KEY_LINK="kas-ef-link", KEY_LOCAL="kas-ef-local-txs-v2", KEY_QUEUE="kas-ef-queue-v2";
var parsedBatch=[], selectedMonth="2026-07";
var DEF_MEMBERS=["Nia","Aditya","Anisa","Aaf","Syarif","Budi","Topik","Yudi","Heru","Dozen","Putri","Arief","Anah","Supriyadi","Zaelani","Nely","Eka"];
var NAME_MAP={"opik":"Topik","topik":"Topik","pak heru":"Heru","heru":"Heru","neli":"Nely","nely":"Nely","nelly":"Nely"};

function normalizeName(raw){
  if(!raw) return "";
  var key=raw.toString().toLowerCase().trim().replace(/^pak\s+/,'');
  if(NAME_MAP[key]) return NAME_MAP[key];
  for(var i=0;i<DEF_MEMBERS.length;i++){ if(DEF_MEMBERS[i].toLowerCase()===key) return DEF_MEMBERS[i]; }
  return raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
}
var DEFAULT_BANKS=[{name:"BCA",number:"6830747280",owner:"Eka Iswanto"},{name:"MANDIRI",number:"1570005764080",owner:"Eka Iswanto"}];
function getBanks(){ try{ var s=localStorage.getItem(KEY_BANK); if(s) return JSON.parse(s); }catch(e){} return DEFAULT_BANKS.slice(); }
function getLink(){ return localStorage.getItem(KEY_LINK)||"https://shorturl.at/JpfTW"; }
function fmt(n){return new Intl.NumberFormat("id-ID").format(Math.abs(n)||0)}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
function monthName(ym){ var [y,m]=ym.split('-'); var months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"]; return months[parseInt(m)-1]+" "+y; }
function ymFromDate(d){ if(!d) return selectedMonth; var dd=new Date(d); if(isNaN(dd)) return selectedMonth; return dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,'0'); }
function initMonths(){
  var sel=document.getElementById('monthSelect');
  var months=[];
  for(var i=-4;i<=8;i++){ var d=new Date(2026,6+i,1); var ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0'); months.push(ym); }
  sel.innerHTML=months.map(ym=>`<option value="${ym}" ${ym===selectedMonth?'selected':''}>${monthName(ym)}</option>`).join('');
}
function changeMonth(ym){ selectedMonth=ym; document.getElementById('anggotaTitle').textContent="Anggota - "+monthName(ym); document.getElementById('txTitle').textContent="Transaksi - "+monthName(ym); document.getElementById('waBulanLabel').textContent=monthName(ym); document.getElementById('adminBulanInfo').textContent="Input untuk bulan: "+monthName(ym); upd(); updateWAPreview(); }
function prevMonth(){ var [y,m]=selectedMonth.split('-').map(Number); var d=new Date(y,m-2,1); var ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0'); document.getElementById('monthSelect').value=ym; changeMonth(ym); }
function nextMonth(){ var [y,m]=selectedMonth.split('-').map(Number); var d=new Date(y,m,1); var ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0'); document.getElementById('monthSelect').value=ym; changeMonth(ym); }

function saveLocal(){ try{ localStorage.setItem(KEY_LOCAL, JSON.stringify(txs)); }catch(e){} }
function loadLocal(){
  try{
    var s=localStorage.getItem(KEY_LOCAL);
    if(s){ var arr=JSON.parse(s); if(Array.isArray(arr) && arr.length>0){ txs=arr; return true; } }
  }catch(e){} return false;
}
function getQueue(){ try{ var s=localStorage.getItem(KEY_QUEUE); return s?JSON.parse(s):[]; }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem(KEY_QUEUE, JSON.stringify(q)); }catch(e){} updateQueueUI(); }
function updateQueueUI(){
  var q=getQueue();
  if(q.length>0){
    document.getElementById('syncBar').style.display='flex';
    document.getElementById('queueCount').textContent=q.length;
    document.getElementById('queueInfo').textContent=q.length+' transaksi belum masuk Google Sheet - klik Sync Sekarang';
  } else {
    document.getElementById('syncBar').style.display='none';
  }
}

function setSyncStatus(type, msg){
  var dot=document.getElementById('syncDot');
  var text=document.getElementById('syncText');
  dot.className='sync-dot '+(type==='ok'?'ok':type==='err'?'err':'');
  text.textContent=msg;
  document.getElementById('dbStatus').style.display='block';
}

// === DB SYNC FIX: POST dengan 3 metode ===
async function addToDBReal(id, date, member, kat, nominal){
  var normalized=normalizeName(member);
  var payload={
    action:'addTransaksi',
    ID:id,
    Tanggal:date,
    Anggota:normalized,
    Kategori:kat,
    Nominal:nominal
  };

  // Metode 1: POST FormData (paling kompatibel dengan Apps Script)
  try{
    var form=new FormData();
    Object.keys(payload).forEach(k=>form.append(k, payload[k]));
    var res=await fetch(URL_G, {method:'POST', body:form});
    // kalau sampai sini tanpa error, anggap sukses (meski CORS)
    return {ok:true, method:'POST FormData'};
  }catch(e1){
    // Metode 2: POST URLSearchParams
    try{
      var params=new URLSearchParams();
      Object.keys(payload).forEach(k=>params.append(k, payload[k]));
      var res2=await fetch(URL_G, {method:'POST', body:params, headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      return {ok:true, method:'POST URLSearchParams'};
    }catch(e2){
      // Metode 3: GET (fallback terakhir) dengan no-cors
      try{
        var url=URL_G+"?action=addTransaksi&ID="+encodeURIComponent(payload.ID)+"&Tanggal="+encodeURIComponent(payload.Tanggal)+"&Anggota="+encodeURIComponent(payload.Anggota)+"&Kategori="+encodeURIComponent(payload.Kategori)+"&Nominal="+encodeURIComponent(payload.Nominal)+"&t="+Date.now();
        await fetch(url, {mode:'no-cors'});
        // no-cors selalu opaque, tapi kita anggap terkirim
        return {ok:true, method:'GET no-cors'};
      }catch(e3){
        return {ok:false, error:e3.message, method:'all failed'};
      }
    }
  }
}

async function queueAdd(id,date,member,kat,nominal){
  var q=getQueue();
  q.push({id:id,date:date,member:member,kat:kat,nominal:nominal, ts:Date.now()});
  setQueue(q);
  // langsung coba sync
  processQueue(false);
}

async function processQueue(showToast){
  var q=getQueue();
  if(q.length===0){
    if(showToast) toast('✅ Tidak ada antrian');
    setSyncStatus('ok', '✅ Semua sudah sync ke DB');
    return;
  }
  setSyncStatus('', '⏳ Sync '+q.length+' ke DB...');
  var newQueue=[];
  var successCount=0;
  for(var i=0;i<q.length;i++){
    var item=q[i];
    var res=await addToDBReal(item.id, item.date, item.member, item.kat, item.nominal);
    if(res.ok){
      successCount++;
    } else {
      newQueue.push(item);
    }
    document.getElementById('syncText').textContent='⏳ Sync '+ (i+1) +'/'+q.length+' - '+successCount+' berhasil';
    await new Promise(r=>setTimeout(r, 400)); // jeda biar tidak spam
  }
  setQueue(newQueue);
  if(newQueue.length===0){
    setSyncStatus('ok', '✅ '+successCount+' transaksi berhasil masuk Google Sheet');
    if(showToast) toast('✅ '+successCount+' berhasil sync ke DB');
    // reload dari DB setelah sync
    setTimeout(loadFromDB, 1000);
  } else {
    setSyncStatus('err', '⚠️ '+successCount+' berhasil, '+newQueue.length+' gagal - coba Sync lagi');
    if(showToast) toast('⚠️ '+newQueue.length+' gagal, coba lagi');
  }
}

function parseDBRow(r){
  var tanggal=r.Tanggal||r.tanggal||''; var anggota=r.Anggota||r.anggota||''; var nominal=r.Nominal||r.nominal||0; var kategori=r.Kategori||r.kategori||''; var id=r.ID||r.id||'';
  var bank='BCA'; var up=(kategori+'').toUpperCase(); if(up.includes('MANDIRI')) bank='MANDIRI'; else if(up.includes('CASH')) bank='CASH';
  var jenis='masuk'; if(up.includes('KELUAR')||Number(nominal)<0) jenis='keluar';
  var ym=ymFromDate(tanggal);
  var normalized=normalizeName(anggota);
  return {id:String(id),date:String(tanggal).slice(0,10)||ym+"-27",ym:ym,memberName:normalized,amount:Math.abs(Number(nominal)||0),bank:bank,jenis:jenis};
}
function loadFromDB(){
  setSyncStatus('', '⏳ Memuat DB...');
  fetch(URL_G+"?action=getData&t="+Date.now()).then(r=>r.text()).then(txt=>{
    try{
      var data=JSON.parse(txt); var rows=data.transaksi||data.data||[]; if(!Array.isArray(rows)&&Array.isArray(data)) rows=data;
      var dbTxs=rows.map(parseDBRow).filter(x=>x.memberName&&x.amount>0);
      if(dbTxs.length>0){
        // merge dengan local yang belum ada di DB (yang ID-nya tidak ada di DB)
        var dbIds=new Set(dbTxs.map(t=>t.id));
        var localOnly=txs.filter(t=> !dbIds.has(t.id) && t.id.startsWith('t-'));
        txs=dbTxs.concat(localOnly);
        saveLocal();
      }
      setSyncStatus('ok', '✅ DB terkoneksi - '+txs.length+' trx');
      upd();
    }catch(e){
      setSyncStatus('', '✅ Offline - '+txs.length+' trx (Local)');
      upd();
    }
  }).catch(()=>{
    setSyncStatus('', '✅ Offline - '+txs.length+' trx (Local)');
    upd();
  });
}

function switchTab(t){
  ['WA','Masuk','Keluar','Format'].forEach(x=>{
    var tab=document.getElementById('tab'+x); if(tab) tab.classList.remove('active','in','out');
    var panel=document.getElementById('panel'+x); if(panel) panel.style.display='none';
  });
  var tCap=t.charAt(0).toUpperCase()+t.slice(1);
  document.getElementById('tab'+tCap).classList.add('active','in');
  document.getElementById('panel'+tCap).style.display='block';
  if(t==='format') updateWAPreview();
}
function getFormatWA(){
  var filtered=txs.filter(t=>t.ym===selectedMonth && t.jenis!=='keluar');
  var keluarBulan=txs.filter(t=>t.ym===selectedMonth && t.jenis==='keluar');
  var totalMasuk=filtered.reduce((s,t)=>s+t.amount,0);
  var totalKeluar=keluarBulan.reduce((s,t)=>s+t.amount,0);
  var saldo=totalMasuk-totalKeluar;
  var banks=getBanks();
  var link=getLink();
  var listRaw=[];
  if(filtered.length>0){
    filtered.slice().reverse().forEach(t=>{
      var raw=t.memberName+" tf "+t.bank.toLowerCase();
      if(t.bank==='CASH') raw=t.memberName+" cash";
      listRaw.push(raw);
    });
  }

  var txt=`*KAS EF - ${monthName(selectedMonth)}*

 Link share ${link}

function parseBatch(){
  var text=document.getElementById('waText').value.trim();
  if(!text){ toast('Paste list dulu'); return; }
  var lines=text.split('\n').map(s=>s.trim()).filter(s=>s.length>0);
  parsedBatch=[];
  lines.forEach(line=>{
    var lower=line.toLowerCase(); var bank='BCA'; if(lower.includes('mandiri')) bank='MANDIRI'; else if(lower.includes('cash')) bank='CASH';
    var rawName=line.split(/tf|cash|bca|mandiri/i)[0].trim().replace(/[^a-zA-Z ]/g,'').trim(); if(!rawName) rawName=line.split(' ')[0];
    var finalName=normalizeName(rawName);
    parsedBatch.push({name:finalName,bank:bank,raw:line.trim()});
  });
  document.getElementById('preview').style.display='block';
  document.getElementById('deteksiInfo').textContent='✅ '+parsedBatch.length+' terdeteksi untuk '+monthName(selectedMonth);
  document.getElementById('previewList').innerHTML=parsedBatch.map((it,i)=>`${i+1}. ${it.raw} → <b>${it.name}</b> • ${it.bank}`).join('<br>');
  document.getElementById('saveBtn').textContent=`💾 2. Simpan ${parsedBatch.length} - MASUK DB + Local`;
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('batchLog').textContent='Siap simpan ke Google Sheet';
}

async function saveBatch(){
  if(!parsedBatch.length){ toast('Deteksi dulu'); return; }
  var btn=document.getElementById('saveBtn');
  btn.disabled=true;
  btn.textContent='⏳ Menyimpan ke DB...';
  var total=parsedBatch.length;
  var dateForMonth=selectedMonth+"-27";

  // 1. Masukkan ke local dulu biar langsung kelihatan
  parsedBatch.forEach((it,idx)=>{
    var id='t-'+it.name.toLowerCase().replace(/\s+/g,'-')+'-'+selectedMonth+'-'+Date.now()+'-'+idx+'-'+Math.random().toString(36).slice(2,6);
    var newTx={id:id,date:dateForMonth,ym:selectedMonth,memberName:it.name,amount:100000,bank:it.bank,jenis:'masuk'};
    txs.push(newTx);
    // 2. Masukkan ke antrian DB
    var kat=it.bank+" | Iuran "+it.name+" | MASUK | "+monthName(selectedMonth);
    queueAdd(id,dateForMonth,it.name,kat,100000);
  });

  saveLocal();
  upd();

  // animasi
  var count=0;
  var interval=setInterval(()=>{
    count++;
    document.getElementById('bar').style.width=Math.round(count/total*100)+'%';
    document.getElementById('batchLog').textContent=count+'/'+total+' - Local tersimpan, sync ke DB...';
    if(count>=total){
      clearInterval(interval);
      btn.textContent='✅ '+total+' Tersimpan - Sync ke DB berjalan';
      toast('✅ '+total+' masuk Local + antrian DB - cek Sync Bar di atas');
      setTimeout(()=>{
        document.getElementById('waText').value='';
        document.getElementById('preview').style.display='none';
        document.getElementById('bar').style.width='0%';
        btn.disabled=false;
        btn.textContent='💾 2. Simpan - Masuk DB';
      }, 1500);
    }
  }, 80);
}

async function saveMasuk(){
  var date=document.getElementById('inDateMasuk').value||selectedMonth+"-27";
  var member=document.getElementById('inMemberMasuk').value;
  var amount=Number(document.getElementById('inAmountMasuk').value);
  var bank=document.getElementById('inBankMasuk').value;
  if(!member||!amount) return toast('Lengkapi');
  var ym=ymFromDate(date);
  var normalized=normalizeName(member);
  var id='t-masuk-'+Date.now()+'-'+Math.random().toString(36).slice(2,5);
  var newTx={id:id,date:date,ym:ym,memberName:normalized,amount:amount,bank:bank,jenis:'masuk'};
  txs.push(newTx);
  saveLocal();
  upd();
  var kat=bank+" | Iuran "+normalized+" | MASUK | "+monthName(ym);
  queueAdd(id,date,normalized,kat,amount);
  toast('✅ Masuk '+normalized+' - masuk Local + antrian DB');
}

async function saveKeluar(){
  var date=document.getElementById('inDateKeluar').value||selectedMonth+"-27";
  var kat=document.getElementById('inKategoriKeluar').value||'Pengeluaran';
  var amount=Number(document.getElementById('inAmountKeluar').value);
  var bank=document.getElementById('inBankKeluar').value;
  var desc=document.getElementById('inDescKeluar').value||kat;
  if(!amount) return toast('Lengkapi');
  var id='t-keluar-'+Date.now();
  var newTx={id:id,date:date,ym:ymFromDate(date),memberName:kat,amount:amount,bank:bank,jenis:'keluar'};
  txs.push(newTx);
  saveLocal();
  upd();
  queueAdd(id,date,kat,bank+" | "+desc+" | KELUAR",-amount);
  toast('✅ Keluar - masuk Local + antrian DB');
}

function upd(){
  var filteredMasukBulan=txs.filter(t=>t.ym===selectedMonth && t.jenis!=='keluar');
  var totalMasukAll=txs.filter(t=>t.jenis!=='keluar').reduce((s,t)=>s+t.amount,0);
  var totalKeluarAll=txs.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+t.amount,0);

  document.getElementById('masukTotal').textContent='Rp '+fmt(totalMasukAll);
  document.getElementById('keluarTotal').textContent='Rp '+fmt(totalKeluarAll);
  document.getElementById('totalSaldo').textContent='Rp '+fmt(totalMasukAll-totalKeluarAll);

  var mapBulan={}; filteredMasukBulan.forEach(t=>{mapBulan[t.memberName]=(mapBulan[t.memberName]||0)+t.amount;});
  var mapTotal={}; txs.filter(t=>t.jenis!=='keluar').forEach(t=>{mapTotal[t.memberName]=(mapTotal[t.memberName]||0)+t.amount;});

  document.getElementById('ac').textContent=Object.keys(mapBulan).length+'/'+DEF_MEMBERS.length+' lunas';
  document.getElementById('tc').textContent=filteredMasukBulan.length+' trx';

  document.getElementById('alist').innerHTML=DEF_MEMBERS.map(name=>{
    var isLunasBulan=mapBulan[name];
    var totalNominal=mapTotal[name]||0;
    var statusText=isLunasBulan ? 'Lunas '+monthName(selectedMonth) : 'Belum bayar '+monthName(selectedMonth);
    var badgeClass=isLunasBulan?'paid':'unpaid';
    var nominalText=totalNominal>0 ? 'Rp '+fmt(totalNominal) : 'Rp 0';
    return `<div class="row"><div class="left"><div class="logo-box ${isLunasBulan?'paid':'unpaid'}">${isLunasBulan?'✓':'✗'}</div><div style="min-width:0"><div class="name">${name}</div><div class="sub">${statusText}</div></div></div><div class="right"><div class="nominal-badge ${badgeClass}">${nominalText}</div></div></div>`;
  }).join('');

  document.getElementById('txlist').innerHTML=txs.filter(t=>t.ym===selectedMonth).slice().reverse().map(t=>{
    return `<div class="row"><div class="left"><div class="logo-box ${t.jenis==='keluar'?'unpaid':'paid'}">${t.jenis==='keluar'?'−':'+'}</div><div><div class="name">${t.memberName} • ${t.bank}</div><div class="sub">${t.date}</div></div></div><div class="right">Rp ${fmt(t.amount)}</div></div>`;
  }).join('')||`<div class="row"><div class="sub">Belum ada transaksi di ${monthName(selectedMonth)}</div></div>`;

  document.getElementById('rlist').innerHTML=getBanks().map(b=>`<div class="row"><div class="left"><div class="logo-box">${b.name.slice(0,3)}</div><div><div style="font-size:11px;color:#999">${b.name} • ${b.owner}</div><div style="font-size:13px;font-weight:700">${b.number}</div></div></div><div class="right"><button class="btn-mini" style="font-size:10px" onclick="navigator.clipboard.writeText('${b.number}');toast('Disalin')">COPY</button></div></div>`).join('');

  var sel=document.getElementById('inMemberMasuk'); if(sel && sel.options.length===0){ DEF_MEMBERS.forEach(m=>{var o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});}
  var bankOpts=getBanks().map(b=>`<option value="${b.name}">${b.name} - ${b.number}</option>`).join('')+`<option value="CASH">CASH</option>`;
  document.getElementById('inBankMasuk').innerHTML=bankOpts;
  document.getElementById('inBankKeluar').innerHTML=bankOpts;

  updateQueueUI();
  updateWAPreview();
}
initMonths(); changeMonth(selectedMonth);

document.getElementById('inDateKeluar').value=selectedMonth+"-27";

upd();

updateQueueUI();
// auto retry queue setiap 15 detik
setInterval(()=>{ var q=getQueue(); if(q.length>0) processQueue(false); }, 15000);
