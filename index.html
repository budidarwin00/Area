<!DOCTYPE html>
<html lang="id">
<head><style>

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}

  font-family: "Optimistic Mono";

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS EF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"SF Pro",Inter,sans-serif;background:#fff;color:#111;max-width:440px;margin:0 auto;padding:0 0 100px;-webkit-font-smoothing:antialiased}
.top{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0ef;position:sticky;top:0;background:#fff;z-index:10}
.logo{font-size:15px;font-weight:900;letter-spacing:-0.03em}
.actions-top{display:flex;gap:6px}
.btn-mini{font-size:11px;border:1px solid #ecece8;border-radius:999px;padding:7px 12px;background:#fff;cursor:pointer;font-weight:600}
.btn-mini.wa{background:#25D366;color:#fff;border-color:#25D366}
.saldo-wrap{padding:20px 20px 20px;border-bottom:1px solid #f6f6f4}
.row-saldo{display:flex;gap:12px}
.item-s{flex:1;background:#fafaf8;border:1px solid #f0f0ef;border-radius:14px;padding:12px 14px}
.item-s small{display:block;font-size:9px;letter-spacing:0.12em;color:#9a9a96;font-weight:700;margin-bottom:4px}
.item-s b{font-size:14px;font-weight:800;display:block}
.section{padding:0 20px;margin-top:26px}
.h{font-size:10px;letter-spacing:0.16em;color:#9a9a96;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between}
.list{border-top:1px solid #f0f0ef}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f6f6f4;gap:12px}
.left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.name{font-size:13px;font-weight:600}.sub{font-size:11px;color:#9a9a96;margin-top:1px}
.mono{font-family:ui-monospace,monospace;font-size:14px;font-weight:700;letter-spacing:-0.02em}
.right{font-size:13px;font-weight:700;white-space:nowrap;display:flex;gap:8px;align-items:center}
.logo-box{width:32px;height:32px;border-radius:10px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.logo-box.cash{background:#fff;color:#111;border:1px solid #ecece8}.logo-box.rek{background:#fff;border:1px solid #ecece8;color:#111;font-size:8px;font-weight:900}
.logo-box svg{width:16px;height:16px}
.btn-del{width:26px;height:26px;border-radius:50%;border:1px solid #ecece8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#999}
.btn-copy{font-size:10px;border:1px solid #ecece8;border-radius:999px;padding:5px 10px;background:#fff;cursor:pointer;font-weight:700;color:#9a9a96}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;padding:10px 16px;border-radius:999px;display:none;z-index:99}
.modal{position:fixed;inset:0;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:#fff;border:1px solid #ecece8;border-radius:20px;padding:20px;width:100%;max-width:360px}
.input{width:100%;border:none;border-bottom:1px solid #ecece8;padding:12px 0;font-size:14px;outline:none}.btn{width:100%;border:1px solid #111;background:#111;color:#fff;border-radius:999px;padding:12px;font-size:12px;font-weight:600;cursor:pointer}.btn-ghost{width:100%;border:1px solid #ecece8;background:#fff;border-radius:999px;padding:12px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="top">
<div class="logo">KAS EF</div>
<div class="actions-top">
<button class="btn-mini" onclick="syncNow(true)">Sync</button>
<button class="btn-mini" onclick="exportPDF()">PDF</button>
<button class="btn-mini wa" onclick="shareWA()">Share WA</button>
<button class="btn-mini" id="loginBtn" onclick="toggleLogin()">Login</button>
</div>
</div>

<div class="saldo-wrap">
<div class="row-saldo">
<div class="item-s"><small>TOTAL SALDO</small><b id="totalSaldo">Rp 1.700.000</b></div>
<div class="item-s"><small>MASUK</small><b id="masuk">Rp 1.700.000</b></div>
<div class="item-s"><small>KELUAR</small><b id="keluar" style="color:#9a9a96">Rp 0</b></div>
</div>
</div>

<div class="section">
<div class="h"><span>REKENING BANK</span><span id="rc">2</span></div>
<div class="list" id="rlist"></div>
</div>

<div class="section">
<div class="h"><span>ANGGOTA • TOTAL IURAN</span><span id="ac">17</span></div>
<div class="list" id="alist"></div>
</div>

<div class="section">
<div class="h"><span>TRANSAKSI</span><span id="tc">17/17</span></div>
<div class="list" id="txlist"></div>
</div>

<div id="login" class="modal"><div class="box"><div style="font-weight:700;font-size:13px">Login Admin</div><input id="pass" type="password" placeholder="Password" class="input" style="margin-top:16px;text-align:center"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-ghost" style="flex:1" onclick="toggleLogin()">Batal</button><button class="btn" style="flex:1" onclick="doLogin()">Masuk</button></div></div></div>
<div id="confirmDel" class="modal"><div class="box"><div style="font-weight:700;font-size:13px">Hapus?</div><div id="delInfo" style="font-size:12px;color:#9a9a96;margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-ghost" style="flex:1" onclick="closeDel()">Batal</button><button class="btn" style="flex:1;background:#e11d48;border-color:#e11d48" onclick="doDelete()">Hapus</button></div></div></div>
<div id="copyM" class="modal"><div class="box" style="text-align:center"><div style="font-size:10px;letter-spacing:0.12em;color:#9a9a96;font-weight:700">NO REKENING</div><div id="copyL" style="font-weight:700;margin-top:4px"></div><div style="background:#fafaf8;border-radius:12px;padding:14px;margin:12px 0"><input id="copyI" readonly style="width:100%;border:none;background:transparent;text-align:center;font-family:ui-monospace;font-size:20px;font-weight:800;outline:none"></div><div style="display:flex;gap:8px"><button class="btn-ghost" style="flex:1" onclick="closeCopy()">Tutup</button><button class="btn" style="flex:1" onclick="copyAgain()">Copy</button></div></div></div>
<div id="pdfM" class="modal"><div class="box" style="text-align:center"><div style="font-weight:700">PDF Siap</div><div id="pdfI" style="font-size:11px;color:#9a9a96;margin-top:4px"></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><button class="btn" onclick="doPrint()">Print / Save PDF</button><button class="btn-ghost" style="border:none" onclick="closePdf()">Tutup</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
var DEF_M=[{name:"Nia"},{name:"Aditya"},{name:"Anisa"},{name:"Aaf"},{name:"Syarif"},{name:"Budi"},{name:"Topik"},{name:"Yudi"},{name:"Heru"},{name:"Dozen"},{name:"Putri"},{name:"Arief"},{name:"Anah"},{name:"Supriyadi"},{name:"Zaelani"},{name:"Nely"},{name:"Eka"}];
var DEF_B=[{id:"b1",name:"BCA",number:"6830747280",owner:"Eka Iswanto"},{id:"b2",name:"MANDIRI",number:"1570005764080",owner:"Eka Iswanto"}];
var PRELOAD=[
{id:"t1",date:"2026-08-27",memberName:"Nia",amount:100000,payType:"transfer",bank:"MANDIRI",desc:"Iuran Nia"},
{id:"t2",date:"2026-08-27",memberName:"Aditya",amount:100000,payType:"transfer",bank:"MANDIRI",desc:"Iuran Aditya"},
{id:"t3",date:"2026-08-27",memberName:"Anisa",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Anisa"},
{id:"t4",date:"2026-08-27",memberName:"Aaf",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Aaf"},
{id:"t5",date:"2026-08-27",memberName:"Syarif",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Syarif"},
{id:"t6",date:"2026-08-27",memberName:"Budi",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Budi"},
{id:"t7",date:"2026-08-27",memberName:"Topik",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Topik"},
{id:"t8",date:"2026-08-27",memberName:"Yudi",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Yudi"},
{id:"t9",date:"2026-08-27",memberName:"Heru",amount:100000,payType:"cash",bank:"CASH",desc:"Iuran Heru"},
{id:"t10",date:"2026-08-27",memberName:"Dozen",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Dozen"},
{id:"t11",date:"2026-08-27",memberName:"Putri",amount:100000,payType:"cash",bank:"CASH",desc:"Iuran Putri"},
{id:"t12",date:"2026-08-27",memberName:"Arief",amount:100000,payType:"cash",bank:"CASH",desc:"Iuran Arief"},
{id:"t13",date:"2026-08-27",memberName:"Anah",amount:100000,payType:"cash",bank:"CASH",desc:"Iuran Anah"},
{id:"t14",date:"2026-08-27",memberName:"Supriyadi",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Supriyadi"},
{id:"t15",date:"2026-08-27",memberName:"Zaelani",amount:100000,payType:"cash",bank:"CASH",desc:"Iuran Zaelani"},
{id:"t16",date:"2026-08-27",memberName:"Nely",amount:100000,payType:"cash",bank:"CASH",desc:"Iuran Nely"},
{id:"t17",date:"2026-08-27",memberName:"Eka",amount:100000,payType:"transfer",bank:"BCA",desc:"Iuran Eka"}
];
var isAdmin=false,txs=PRELOAD.slice(),KEY="kas-v84-v2-deskripsi",lastBlob=null,delId=null,lastNum='';
function fmt(n){return new Intl.NumberFormat("id-ID").format(n||0)}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function toggleLogin(){var m=document.getElementById('login');if(isAdmin){isAdmin=false;localStorage.setItem(KEY+'-admin','0');upd();m.style.display='none';return}m.style.display=m.style.display==='flex'?'none':'flex'}
function doLogin(){var p=document.getElementById('pass').value.trim().toLowerCase();if(p==='askief'){isAdmin=true;localStorage.setItem(KEY+'-admin','1');document.getElementById('login').style.display='none';document.getElementById('pass').value='';upd()}}
function svgBank(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10L12 4l9 6v1H3v-1z"/><path d="M2 19h20"/></svg>'}
function svgCash(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>'}
function askDelete(id){if(!isAdmin){toggleLogin();return}delId=id;var t=txs.find(x=>x.id===id);if(t) document.getElementById('delInfo').textContent=t.memberName+' • Rp '+fmt(t.amount);document.getElementById('confirmDel').style.display='flex'}
function closeDel(){document.getElementById('confirmDel').style.display='none';delId=null}
function doDelete(){if(!delId) return;txs=txs.filter(x=>x.id!==delId);localStorage.setItem(KEY+'-txs',JSON.stringify(txs));upd();closeDel();toast('Dihapus')}
function copyRek(num,label){lastNum=String(num).trim();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastNum).then(()=>{toast('Disalin');showCopy(lastNum,label)}).catch(()=>showCopy(lastNum,label))}else showCopy(lastNum,label)}
function showCopy(num,label){document.getElementById('copyL').textContent=label;document.getElementById('copyI').value=num;document.getElementById('copyM').style.display='flex';setTimeout(()=>{document.getElementById('copyI').select()},100)}
function closeCopy(){document.getElementById('copyM').style.display='none'}
function copyAgain(){var i=document.getElementById('copyI');i.select();try{document.execCommand('copy');toast('Disalin');setTimeout(closeCopy,500)}catch(e){}}
function exportPDF(){var html='<html><head><meta charset="UTF-8"><style>body{font-family:system-ui;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px;font-size:11px}th{background:#111;color:#fff}.r{text-align:right}</style></head><body><h3>KAS EF</h3><p>Total Saldo: Rp '+fmt(txs.reduce((s,t)=>s+t.amount,0))+'</p><table><tr><th>No</th><th>Nama</th><th>Total Iuran</th></tr>';DEF_M.forEach((m,i)=>{var tot=txs.filter(t=>t.memberName===m.name).reduce((s,t)=>s+t.amount,0);html+=`<tr><td>${i+1}</td><td>${m.name}</td><td class="r">Rp ${fmt(tot)}</td></tr>`});html+='</table></body></html>';var blob=new Blob([html],{type:'text/html'});if(lastBlob)URL.revokeObjectURL(lastBlob);lastBlob=URL.createObjectURL(blob);document.getElementById('pdfI').textContent=txs.length+' trx';document.getElementById('pdfM').style.display='flex'}
function closePdf(){document.getElementById('pdfM').style.display='none'}
function doPrint(){if(!lastBlob)return;var w=window.open(lastBlob,'_blank');setTimeout(()=>w.print(),400)}
function syncNow(show){if(show)toast('Online')}
function shareWA(){
var masuk=txs.reduce((s,t)=>s+t.amount,0);
var txt=`*KAS EF*%0A%0A`;
txt+=`Total Saldo: Rp ${fmt(masuk)}%0A`;
txt+=`Masuk: Rp ${fmt(masuk)}%0A`;
txt+=`Keluar: Rp 0%0A%0A`;
txt+=`*Total Iuran per Anggota:*%0A`;
DEF_M.forEach(m=>{
  var tot=txs.filter(t=>t.memberName===m.name).reduce((s,t)=>s+t.amount,0);
  txt+=`${m.name}: Rp ${fmt(tot)}%0A`;
});
txt+=`%0ATotal: Rp ${fmt(masuk)} (17 anggota lunas)`;
window.open("https://wa.me/?text="+txt,'_blank');
}
function upd(){
 var masuk=txs.reduce((s,t)=>s+t.amount,0);
 document.getElementById('totalSaldo').textContent='Rp '+fmt(masuk);
 document.getElementById('masuk').textContent='Rp '+fmt(masuk);
 document.getElementById('keluar').textContent='Rp 0';
 document.getElementById('ac').textContent=DEF_M.length;
 document.getElementById('rc').textContent=DEF_B.length;
 document.getElementById('tc').textContent=txs.length+'/'+txs.length;
 document.getElementById('loginBtn').textContent=isAdmin?'Keluar':'Login';
 document.getElementById('rlist').innerHTML=DEF_B.map(b=>{
  return `<div class="row"><div class="left"><div class="logo-box rek">${b.name.substring(0,3)}</div><div><div class="name" style="font-size:11px;color:#9a9a96">${b.name} • ${b.owner}</div><div class="mono" onclick="copyRek('${b.number}','${b.name}')">${b.number}</div></div></div><div class="right"><button class="btn-copy" onclick="copyRek('${b.number}','${b.name}')">COPY</button></div></div>`
 }).join('');
 document.getElementById('alist').innerHTML=DEF_M.map(m=>{
  var tot=txs.filter(t=>t.memberName===m.name).reduce((s,t)=>s+t.amount,0);
  return `<div class="row"><div class="left"><div class="name">${m.name}</div></div><div class="right">Rp ${fmt(tot)}</div></div>`
 }).join('');
 document.getElementById('txlist').innerHTML=txs.map(t=>{
  var isTr=t.payType==='transfer';
  return `<div class="row"><div class="left"><div class="logo-box ${isTr?'bank':'cash'}">${isTr?svgBank():svgCash()}</div><div><div class="name">${t.memberName} • ${t.bank}</div><div class="sub">${t.date} • ${t.desc}</div></div></div><div class="right">Rp ${fmt(t.amount)} ${isAdmin?`<button class="btn-del" onclick="askDelete('${t.id}')">×</button>`:''}</div></div>`
 }).join('');
}
upd();
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.style.display='none'}))
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
