<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAS EF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"SF Pro",Inter,sans-serif;background:#0a0a0a;color:#f5f5f5;max-width:440px;margin:0 auto;padding:0 0 100px;-webkit-font-smoothing:antialiased}
.top{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0a0a0a;z-index:20}
.logo{font-size:36px;font-weight:900;letter-spacing:-0.05em;line-height:1;color:#fff}
.actions-top{display:flex;gap:8px;align-items:center}
.btn-mini{font-size:12px;border:1px solid #2a2a2a;border-radius:999px;padding:8px 14px;background:#1a1a1a;color:#fff;cursor:pointer;font-weight:700}
.btn-mini.wa{background:#25D366;color:#fff;border-color:#25D366;display:none} /* HANYA MUNCUL DI ADMIN */
.btn-mini.wa.show{display:block}
.saldo-wrap{padding:18px 20px 16px;border-bottom:1px solid #1a1a1a}
.row-saldo{display:flex;gap:10px}
.item-s{flex:1;background:#141414;border:1px solid #222;border-radius:14px;padding:12px}
.item-s small{display:block;font-size:9px;letter-spacing:0.12em;color:#777;font-weight:700;margin-bottom:3px}
.item-s b{font-size:15px;font-weight:800;display:block;color:#fff}
.section{padding:0 20px;margin-top:24px}
.h{font-size:10px;letter-spacing:0.14em;color:#666;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;text-transform:uppercase}
.list{border-top:1px solid #1a1a1a}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a1a1a;gap:10px}
.left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.sub{font-size:11px;color:#777;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:ui-monospace,monospace;font-size:13px;font-weight:700;color:#fff}
.right{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;display:flex;gap:6px;align-items:center}
.logo-box{width:34px;height:34px;border-radius:10px;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #2a2a2a}.logo-box.cash{background:#111;color:#aaa;border:1px solid #2a2a2a}.logo-box.rek{background:#111;border:1px solid #2a2a2a;color:#fff;font-size:9px;font-weight:900}
.logo-box svg{width:16px;height:16px}
.btn-copy{font-size:10px;border:1px solid #2a2a2a;border-radius:999px;padding:6px 12px;background:#1a1a1a;cursor:pointer;font-weight:700;color:#aaa}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-size:12px;padding:10px 16px;border-radius:999px;display:none;z-index:99;max-width:92%;text-align:center;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:#141414;border:1px solid #2a2a2a;border-radius:20px;padding:20px;width:100%;max-width:360px;color:#fff}
.input{width:100%;border:none;border-bottom:1px solid #333;padding:12px 0;font-size:14px;outline:none;text-align:center;background:transparent;color:#fff}
.btn{width:100%;border:1px solid #fff;background:#fff;color:#000;border-radius:999px;padding:12px;font-size:12px;font-weight:700;cursor:pointer}.btn-ghost{width:100%;border:1px solid #333;background:#1a1a1a;border-radius:999px;padding:12px;font-size:12px;cursor:pointer;color:#fff}
</style>
</head>
<body>
<div class="top">
<div class="logo">KAS EF</div>
<div class="actions-top">
<button class="btn-mini wa" id="shareWABtn" onclick="shareWA()">Share WA</button>
<button class="btn-mini" id="loginBtn" onclick="toggleLogin()">Login</button>
</div>
</div>

<div class="saldo-wrap">
<div class="row-saldo">
<div class="item-s"><small>TOTAL SALDO</small><b id="totalSaldo">Rp -</b></div>
<div class="item-s"><small>MASUK</small><b id="masuk">Rp -</b></div>
<div class="item-s"><small>KELUAR</small><b id="keluar" style="color:#666">Rp 0</b></div>
</div>
<!-- BOX MERAH SUDAH DIHILANGKAN TOTAL, tapi sync tetap jalan di background -->
</div>

<div class="section">
<div class="h"><span>Rekening Bank</span><span id="rc">2</span></div>
<div class="list" id="rlist"></div>
</div>

<div class="section">
<div class="h"><span>Anggota • Total Iuran</span><span id="ac">-</span></div>
<div class="list" id="alist"></div>
</div>

<div class="section">
<div class="h"><span>Transaksi</span><span id="tc">- </span></div>
<div class="list" id="txlist"></div>
</div>

<div id="login" class="modal"><div class="box"><div style="font-weight:700;text-align:center">Login Admin</div><input id="pass" type="password" placeholder="Password" class="input" style="margin-top:14px"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-ghost" style="flex:1" onclick="toggleLogin()">Batal</button><button class="btn" style="flex:1" onclick="doLogin()">Masuk</button></div><div style="font-size:10px;color:#666;text-align:center;margin-top:12px">Pass: askief • Share WA hanya muncul setelah login</div></div></div>

<div id="toast" class="toast"></div>

<script>
var URL_G="https://script.google.com/macros/s/AKfycbwZyzfPgJiNbBsxwKAfFxnRq2Iz50g9XYvkXU9CJdfywd9bc9n5bGpv7sXyKSOE3Ux72A/exec";
var txs=[], isAdmin=false, KEY="kas-v84-v2-deskripsi";
function fmt(n){return new Intl.NumberFormat("id-ID").format(n||0)}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function svgBank(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10L12 4l9 6v1H3v-1z"/><path d="M2 19h20"/></svg>'}
function svgCash(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>'}
function parseDBRow(r){
  var tanggal = r.Tanggal || r.tanggal || r.date || '';
  var anggota = r.Anggota || r.anggota || r.nama || '';
  var nominal = r.Nominal || r.nominal || r.amount || 0;
  var kategori = r.Kategori || r.kategori || '';
  var id = r.ID || r.id || (anggota+'-'+tanggal+'-'+nominal);
  var bank='CASH';
  if(kategori.toUpperCase().includes('BCA')) bank='BCA';
  else if(kategori.toUpperCase().includes('MANDIRI')) bank='MANDIRI';
  else if(kategori.toUpperCase().includes('CASH')) bank='CASH';
  var pay = kategori.toLowerCase().includes('cash') ? 'cash' : 'transfer';
  var desc = kategori || ('Iuran '+anggota);
  var dateStr = String(tanggal).slice(0,10);
  return {id:String(id), date:dateStr||'2026-08-27', memberName:String(anggota).trim(), amount:Number(nominal)||0, bank:bank, desc:desc, pay:pay};
}
function loadFromDB(){
  fetch(URL_G+"?action=getData&t="+Date.now())
    .then(r=>r.text())
    .then(txt=>{
      var data; try{ data=JSON.parse(txt); }catch(e){ data={transaksi:[]}; }
      var rows = data.transaksi || data.data || data.result || [];
      if(!Array.isArray(rows) && Array.isArray(data)) rows=data;
      var parsed = rows.map(parseDBRow).filter(x=>x.memberName && x.amount>0);
      if(parsed.length>0){
        txs = parsed;
        upd();
        localStorage.setItem(KEY+'-txs', JSON.stringify(txs));
      } else {
        // fallback minimal
        txs = [{memberName:"Aaf",amount:300000,bank:"BCA",date:"2026-08-27",desc:"Iuran Aaf",pay:"transfer"}];
        upd();
      }
    })
    .catch(()=>{});
}
function toggleLogin(){
  var m=document.getElementById('login');
  if(isAdmin){
    isAdmin=false;
    localStorage.setItem(KEY+'-admin','0');
    document.getElementById('loginBtn').textContent='Login';
    document.getElementById('shareWABtn').classList.remove('show');
    toast('Logout');
    upd();
    m.style.display='none';
    return;
  }
  m.style.display=m.style.display==='flex'?'none':'flex';
}
function doLogin(){
  var p=document.getElementById('pass').value.trim().toLowerCase();
  if(p==='askief'){
    isAdmin=true;
    localStorage.setItem(KEY+'-admin','1');
    document.getElementById('login').style.display='none';
    document.getElementById('pass').value='';
    document.getElementById('loginBtn').textContent='Admin ✓';
    document.getElementById('shareWABtn').classList.add('show');
    toast('Admin aktif - Share WA muncul');
    upd();
  } else {
    toast('Password salah');
  }
}
function shareWA(){
  if(!isAdmin){toggleLogin();return;}
  var masuk=txs.reduce((s,t)=>s+t.amount,0);
  var map={}; txs.forEach(t=>{map[t.memberName]=(map[t.memberName]||0)+t.amount;});
  var txt=`*KAS EF - ${txs.length} transaksi*%0A%0ATotal Saldo: Rp ${fmt(masuk)}%0A%0ARincian:%0A`;
  Object.keys(map).sort().forEach(k=>{txt+=`${k}: Rp ${fmt(map[k])}%0A`;});
  txt+=`%0ATotal: Rp ${fmt(masuk)}`;
  window.open("https://wa.me/?text="+txt,'_blank');
}
function upd(){
  var masuk=txs.reduce((s,t)=>s+t.amount,0);
  document.getElementById('totalSaldo').textContent='Rp '+fmt(masuk);
  document.getElementById('masuk').textContent='Rp '+fmt(masuk);
  document.getElementById('keluar').textContent='Rp 0';
  document.getElementById('tc').textContent=txs.length+' trx';
  var map={};
  txs.forEach(t=>{if(!map[t.memberName]) map[t.memberName]=0; map[t.memberName]+=t.amount;});
  var members = Object.keys(map).sort();
  document.getElementById('ac').textContent=members.length;
  document.getElementById('alist').innerHTML=members.map(n=>`<div class="row"><div class="left"><div class="name">${n}</div></div><div class="right">Rp ${fmt(map[n])}</div></div>`).join('');
  document.getElementById('txlist').innerHTML=txs.slice().reverse().slice(0,50).map(t=>{
    var isTr=t.pay!=='cash';
    return `<div class="row"><div class="left"><div class="logo-box ${isTr?'':'cash'}">${isTr?svgBank():svgCash()}</div><div style="min-width:0"><div class="name">${t.memberName} • ${t.bank}</div><div class="sub">${t.date} • ${t.desc}</div></div></div><div class="right">Rp ${fmt(t.amount)}</div></div>`;
  }).join('');
  document.getElementById('rlist').innerHTML=[{name:"BCA",number:"6830747280",owner:"Eka Iswanto"},{name:"MANDIRI",number:"1570005764080",owner:"Eka Iswanto"}].map(b=>`<div class="row"><div class="left"><div class="logo-box rek">${b.name.slice(0,3)}</div><div><div style="font-size:11px;color:#777">${b.name} • ${b.owner}</div><div class="mono">${b.number}</div></div></div><div class="right"><button class="btn-copy" onclick="navigator.clipboard.writeText('${b.number}');toast('Disalin ${b.name}')">COPY</button></div></div>`).join('');
  // cek admin dari storage
  if(localStorage.getItem(KEY+'-admin')==='1'){
    isAdmin=true;
    document.getElementById('loginBtn').textContent='Admin ✓';
    document.getElementById('shareWABtn').classList.add('show');
  }
}
// auto load DB
loadFromDB();
setTimeout(loadFromDB,2000);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.style.display='none'}))
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
